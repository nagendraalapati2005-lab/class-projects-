<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400" role="img" aria-label="Alapati family royal crest" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8e39a"/>
      <stop offset="0.35" stop-color="#d9a91e"/>
      <stop offset="0.7" stop-color="#9a6a12"/>
      <stop offset="1" stop-color="#ecca62"/>
    </linearGradient>
    <radialGradient id="field" cx="0.5" cy="0.45" r="0.7">
      <stop offset="0" stop-color="#7a4b31"/>
      <stop offset="1" stop-color="#34200f"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5a3a28"/>
      <stop offset="1" stop-color="#2c1a0e"/>
    </linearGradient>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a2e1c"/>
      <stop offset="1" stop-color="#251409"/>
    </linearGradient>
    <path id="topArc" d="M58,200 A142,142 0 0,1 342,200"/>
    <path id="bottomArc" d="M38,200 A162,162 0 0,0 362,200"/>
  </defs>

  <!-- outer seal: gold rim, dark text band -->
  <circle cx="200" cy="200" r="192" fill="url(#gold)"/>
  <circle cx="200" cy="200" r="185" fill="url(#ring)"/>
  <circle cx="200" cy="200" r="174" fill="none" stroke="url(#gold)" stroke-width="2"/>
  <circle cx="200" cy="200" r="134" fill="none" stroke="url(#gold)" stroke-width="4"/>

  <!-- curved lettering -->
  <text font-family="Georgia, 'Times New Roman', serif" font-size="24" font-weight="bold" letter-spacing="6" fill="url(#gold)" text-anchor="middle">
    <textPath href="#topArc" startOffset="50%">ALAPATI FAMILY</textPath>
  </text>
  <text font-family="Georgia, 'Times New Roman', serif" font-size="19" font-weight="bold" letter-spacing="4" fill="url(#gold)" text-anchor="middle">
    <textPath href="#bottomArc" startOffset="50%">HONOUR • UNITY • LOVE</textPath>
  </text>

  <!-- diamonds separating the two lines of text -->
  <polygon points="47,191 55,200 47,209 39,200" fill="url(#gold)"/>
  <polygon points="353,191 361,200 353,209 345,200" fill="url(#gold)"/>

  <!-- centre field -->
  <circle cx="200" cy="200" r="130" fill="url(#field)"/>

  <!-- laurel wreath: left branch, then mirrored right branch -->
  <g fill="url(#gold)">
    <g transform="rotate(190 200 200) rotate(-35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(210 200 200) rotate(-35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(230 200 200) rotate(-35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(250 200 200) rotate(-35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(270 200 200) rotate(-35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(290 200 200) rotate(-35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(310 200 200) rotate(-35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>

    <g transform="rotate(170 200 200) rotate(35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(150 200 200) rotate(35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(130 200 200) rotate(35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(110 200 200) rotate(35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(90 200 200) rotate(35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(70 200 200) rotate(35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
    <g transform="rotate(50 200 200) rotate(35 200 88)"><ellipse cx="200" cy="88" rx="6" ry="14"/></g>
  </g>

  <!-- shield -->
  <path d="M148,134 H252 V214 C252,256 226,282 200,298 C174,282 148,256 148,214 Z"
        fill="url(#shield)" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round"/>
  <path d="M158,144 H242 V212 C242,248 222,270 200,284 C178,270 158,248 158,212 Z"
        fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>

  <!-- monogram -->
  <text x="200" y="250" font-family="Georgia, 'Times New Roman', serif" font-size="100" font-weight="bold" text-anchor="middle" fill="url(#gold)">A</text>

  <!-- small star under the letter -->
  <polygon points="200,262 203,270 211,270 205,275 207,283 200,278 193,283 195,275 189,270 197,270" fill="url(#gold)"/>

  <!-- crown -->
  <path d="M170,118 L165,90 L183,105 L200,84 L217,105 L235,90 L230,118 Z" fill="url(#gold)" stroke="#7a4f0e" stroke-width="1.5" stroke-linejoin="round"/>
  <rect x="169" y="116" width="62" height="12" rx="3" fill="url(#gold)" stroke="#7a4f0e" stroke-width="1.5"/>
  <circle cx="165" cy="88" r="4.5" fill="url(#gold)"/>
  <circle cx="200" cy="81" r="5" fill="url(#gold)"/>
  <circle cx="235" cy="88" r="4.5" fill="url(#gold)"/>
  <circle cx="200" cy="122" r="3.5" fill="#a3242a"/>
  <circle cx="184" cy="122" r="2.5" fill="#1f5a8a"/>
  <circle cx="216" cy="122" r="2.5" fill="#1f5a8a"/>
</svg>
