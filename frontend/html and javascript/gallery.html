
<!DOCTYPE html>

    <title>Family Gallery</title>

    <link rel="stylesheet" href="../css/gallery.css">

<body>


<section class="gallery">

    <div id="our-gallery">

        <h1>Our Gallery</h1>

        <p>
            Share your favourite family memories
        </p>

    </div>


    <div class="upload-box">

        <h2>
            Upload your favorite family photos
        </h2>


        <form id="upload-form">

            <input
                type="file"
                id="file-input"
                accept="image/*"
                multiple
                required
            >


            <button type="submit">
                Upload Images
            </button>

        </form>


        <p id="upload-message"></p>

    </div>


    <div
        class="gallery-grid"
        id="gallery-grid">
    </div>


</section>

<script src="gallery.js"></script>
</body>
